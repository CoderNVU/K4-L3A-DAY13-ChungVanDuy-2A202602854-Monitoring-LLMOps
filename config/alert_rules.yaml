alerts:
  - name: HighLatencyP95Symptom
    severity: warning
    condition: latency_p95 > 3000ms
    duration: 3m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-1
  - name: ElevatedErrorRateSymptom
    severity: critical
    condition: error_rate_pct > 2%
    duration: 2m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-2
  - name: RetrievalSuccessDegradationSymptom
    severity: warning
    condition: retrieval_success_rate_pct < 90%
    duration: 3m
    type: symptom-based
    channel: slack
    owner: oncall-rag-team
    runbook: docs/alerts.md#alert-3
